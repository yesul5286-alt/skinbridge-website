<body>
<header class="hd">
  <div class="hd-in">
    <a href="/tw/" class="logo">Skinbridge<small>CURATED KOREAN AESTHETICS</small></a>
    <a href="/tw/#clinics" class="hd-search" aria-label="搜尋診所"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></a>
  </div>
</header>
<main class="wrap" id="app"></main>

<div class="wrap"><footer>
  <p>Skinbridge 為連接台灣顧客與韓國合作醫療院所的服務，醫療行為皆由各院所醫師執行，是否適合施作須經醫師諮詢判斷。</p>
  <p>價格以韓元為準，是否含 VAT 依各診所標示；台幣為參考價（1 NT$ ≈ 41.6 韓元，2026.11）。實際療程與價格以診所諮詢為準。部分診所資料來源：健康保險審查評價院（HIRA）。</p>
  <p class="fl"><span class="logo-s">SKINBRIDGE</span><a class="link" href="https://line.me/R/ti/p/%40911xoyoc" target="_blank" rel="noopener">LINE 官方帳號</a></p>
</footer></div>

<div class="bar" id="bar" hidden><div class="bar-in" id="barIn"></div></div>

<script src="/tw/sb-common.js?v=202611132138"></script>
<script>
function viewApply(){
  const p = state.prefill || { type:"booking", clinic:"selena", item:"" };
  const opts = CLINICS.map(c => `<option value="${c.id}" ${c.id === p.clinic ? "selected" : ""}>${esc(c.name)}（${c.region}）</option>`).join("");
  const min = new Date(Date.now() + 864e5).toISOString().slice(0,10);
  const head = `<a class="back" href="${HOME_URL}">← 回到首頁</a><div class="sh" style="border:0;padding:0"><div><span class="en">APPLY</span><h2>預約諮詢・報名體驗團</h2></div></div>`;
  if (!me && p.type !== "camp") return viewBookGate(p);
  if (me && p.type !== "camp") return viewBooking(p);

  if (!me) {
    return `<div class="view">${head}
      <div class="gate">
        <h3>用 LINE 登入後即可申請</h3>
        <p>不需要另外註冊。登入時會一併加入 Skinbridge LINE 好友，審核結果、到診提醒都會用 LINE 以中文通知你。</p>
        <button class="btn line" type="button" id="lineLogin">用 LINE 登入</button>
        ${IS_SITE ? "" : `<p class="note">示範模式：正式上線後，這個按鈕會開啟 LINE 登入畫面。</p>`}
      </div></div>`;
  }

  return `<div class="view">${head}
    <div class="who"><span>已用 LINE 登入：<b>${esc(me.name)}</b></span>${me.friend ? `<span class="ok">已是好友</span>` : `<a class="link" href="${friendUrl()}" target="_blank" rel="noopener">加入好友 →</a>`}</div>
    <form class="form" id="form" novalidate>
      <div class="seg" role="group" aria-label="申請類型">
        <button type="button" data-type="booking" aria-pressed="${p.type === "booking"}">預約諮詢</button>
        <button type="button" data-type="camp" aria-pressed="${p.type === "camp"}">報名體驗團</button>
      </div>
      <div class="two">
        <div class="f"><label for="fClinic">診所 <i>*</i></label><select id="fClinic">${opts}</select></div>
        <div class="f" id="itemWrap"><label for="fItem">療程 <i>*</i></label><select id="fItem"></select></div>
      </div>
      <div class="two" id="wishWrap">
        <div class="f"><label for="fWish1">第一志願方案 <i>*</i></label><select id="fWish1"></select></div>
        <div class="f"><label for="fWish2">第二志願方案</label><select id="fWish2"></select></div>
      </div>
      <p class="perk-note" id="perkNote" hidden></p>
      <div class="two">
        <div class="f"><label for="fDate">希望日期 <i>*</i></label><input id="fDate" type="date" min="${min}"></div>
        <div class="f"><label for="fTime">希望時段 <i>*</i></label><select id="fTime"><option value="">請選擇</option><option>上午 10–13 點</option><option>下午 13–17 點</option><option>傍晚 17–20 點</option><option>都可以</option></select></div>
      </div>
      <div class="two">
        <div class="f"><label for="fName">姓名 <i>*</i></label><input id="fName" autocomplete="name" value="${esc(me.name)}"></div>
        <div class="f"><label for="fYear">出生年 <i>*</i></label><input id="fYear" inputmode="numeric" maxlength="4" placeholder="1995"></div>
      </div>
      <div class="f" id="igWrap"><label for="fIg">Instagram 帳號 <span id="igReq"></span></label><input id="fIg" placeholder="@xiaomei"></div>
      <div class="f"><label for="fConcern">目前的皮膚困擾</label><textarea id="fConcern" placeholder="例如：毛孔粗大、痘疤、下顎線不明顯"></textarea></div>
      <label class="agree"><input type="checkbox" id="fAgree"><span>我同意 Skinbridge 為聯繫與安排之目的使用以上資料與 LINE 帳號，並了解實際施作與否須經醫師諮詢判斷。</span></label>
      <p class="err" id="err" aria-live="polite"></p>
      <button class="btn rose" type="submit" id="submitBtn">送出申請</button>
    </form>
    <div class="done" id="done" hidden>
      <h3>已收到你的申請</h3>
      <p id="doneMsg"></p>
      <pre id="summary"></pre>
      <div class="acts" id="doneActs"></div>
    </div>
  </div>`;
}

/* ===== 예약 신청 3단계 ===== */
const BK_YN = [["沒有","없음"],["有","있음"],["不確定","미확인"]];
const BK_PERSON = () => ({ name:"", birth:"", past:"", pastT:"", allergy:"", allergyT:"", meds:"", medsT:"", treats:[] });
let bk = null;
function bkKey(id){ return "sb-bk-" + id; }
function bkLoad(p){
  const c = clinicOf(p.clinic) || CLINICS[0];
  let s = null; try { s = JSON.parse(sessionStorage.getItem(bkKey(c.id))); } catch (_) {}
  const base = Object.assign(BK_PERSON(), { clinic:c.id, step:1, concerns:[], treats:p.item ? [p.item] : [], extra:p.item || "",
    date:"", time:"", people:"1", comp:[], note:"", agree:false, done:false });
  bk = Object.assign(base, s || {});
  if (!Array.isArray(bk.comp)) bk.comp = [];
  if (p.item) bk.extra = bk.extra || p.item;
  if (!bk.name && me && me.name) bk.name = me.name;
  return c;
}
function bkSave(){ try { sessionStorage.setItem(bkKey(bk.clinic), JSON.stringify(bk)); } catch (_) {} }
/* 경로("comp.0.name") 로 값 읽기/쓰기 */
function bkGet(path){ return path.split(".").reduce((o, k) => o == null ? o : o[k], bk); }
function bkSet(path, v){ const ks = path.split("."), last = ks.pop(); ks.reduce((o, k) => o[k], bk)[last] = v; }
/* 진료 시간 안에서 30분 단위 (점심시간·마감 1시간 전 이후 제외) */
function bkSlots(c, date){
  if (!date) return { slots: [], closed: false };
  const d = new Date(date + "T00:00:00"), idx = (d.getDay() + 6) % 7;
  const h = c.hours ? c.hours[idx] : "10:00-19:00";
  if (!h) return { slots: [], closed: true };
  const m = String(h).match(/(\d{1,2}):(\d{2})\s*[-~]\s*(\d{1,2}):(\d{2})/);
  if (!m) return { slots: [], closed: false };
  const toMin = (a, b) => (+a) * 60 + (+b);
  const open = toMin(m[1], m[2]), close = toMin(m[3], m[4]);
  const lm = String(c.lunch || "").match(/(\d{1,2}):(\d{2})\s*[-~]\s*(\d{1,2}):(\d{2})/);
  const l0 = lm ? toMin(lm[1], lm[2]) : -1, l1 = lm ? toMin(lm[3], lm[4]) : -1;
  const out = [];
  for (let t = open; t <= close - 60; t += 30) {
    if (lm && t >= l0 && t < l1) continue;
    out.push(String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"));
  }
  return { slots: out, closed: false, guess: !c.hours };
}
function bkHead(c, step){
  const img = (c.interior && c.interior[0]) || (c.photos && c.photos[0]) || "";
  const title = c.benefit ? "9折預約" : "預約診所";
  const steps = ["需求與療程", "預約資料", "確認送出"];
  return `<a class="back" href="/tw/#c-${c.id}">← 回到診所頁面</a>
    <header class="bk-h"><h1>${step === 2 ? "預約資料" : step === 3 ? "確認送出" : title}</h1>
      <span class="bk-en">${c.benefit ? "SKINBRIDGE PRIVILEGE · 專屬 9折禮遇" : "SKINBRIDGE BOOKING"}</span></header>
    ${step ? `<ol class="bk-steps" aria-label="步驟 ${step} / 3">${steps.map((s, i) => `<li class="${i + 1 === step ? "on" : i + 1 < step ? "ok" : ""}"${i + 1 === step ? ' aria-current="step"' : ""}><span>${i + 1 < step ? "✓" : i + 1}</span><b>${s}</b></li>`).join("")}</ol>` : ""}
    <div class="bk-cl">${img ? `<img src="${esc(img)}" alt="">` : ""}<div><b>${esc(c.name)}</b><span>${esc(c.area)} · ${esc(c.region)}</span>${c.benefit ? `<em>SKINBRIDGE PRIVILEGE · 專屬 9折禮遇</em>` : ""}</div></div>`;
}
function viewBookGate(p){
  const c = clinicOf(p.clinic) || CLINICS[0];
  return `<div class="view bk">${bkHead(c, 0)}
    <div class="gate">
      <h3>用 LINE 登入後即可預約</h3>
      <p>不需要另外註冊。登入時會一併加入 Skinbridge LINE 好友，預約確認與到診提醒都會用 LINE 以中文通知你。</p>
      <button class="btn line" type="button" id="lineLogin">用 LINE 登入</button>
      ${IS_SITE ? "" : `<p class="note">示範模式：正式上線後，這個按鈕會開啟 LINE 登入畫面。</p>`}
    </div></div>`;
}
const bkChips = (key, list, sel) => `<div class="bk-chips" role="group">${list.map(x => `<button type="button" data-bkm="${key}" data-v="${esc(x)}" aria-pressed="${sel.includes(x)}">${esc(x)}</button>`).join("")}</div>`;
const bkYN = (pre, key, label, ph) => { const k = pre + key, v = bkGet(k);
  return `<div class="bk-f" id="f-${k.replace(/\./g, "-")}"><span class="bk-l">${label} <i>*</i></span>
    <div class="bk-seg" role="group" aria-label="${label}">${BK_YN.map(([y]) => `<button type="button" data-bks="${k}" data-v="${y}" aria-pressed="${v === y}">${y}</button>`).join("")}</div>
    ${v === "有" ? `<input data-bki="${k}T" value="${esc(bkGet(k + "T") || "")}" maxlength="60" placeholder="${ph}" aria-label="${label}內容">` : ""}
    <p class="bk-err" data-err="${k.replace(/\./g, "-")}"></p></div>`; };
/* 한 사람 정보(본인 pre="" / 동행 pre="comp.0.") */
function bkPerson(pre, treatList){
  const id = s => (pre + s).replace(/\./g, "-");
  return `<label class="bk-f" id="f-${id("name")}"><span class="bk-l">姓名 <i>*</i><small>請填寫與護照相同的英文姓名</small></span><input data-bki="${pre}name" value="${esc(bkGet(pre + "name") || "")}" maxlength="40" placeholder="例：WANG XIAO MEI"><p class="bk-err" data-err="${id("name")}"></p></label>
    <label class="bk-f" id="f-${id("birth")}"><span class="bk-l">出生日期 <i>*</i></span><input type="date" data-bki="${pre}birth" value="${esc(bkGet(pre + "birth") || "")}" max="${new Date().toISOString().slice(0, 10)}"><p class="bk-err" data-err="${id("birth")}"></p></label>
    ${treatList ? `<div class="bk-f" id="f-${id("treats")}"><span class="bk-l">想做的療程<small>可複選</small></span>${bkChips(pre + "treats", treatList, bkGet(pre + "treats") || [])}<p class="bk-err" data-err="${id("treats")}"></p></div>` : ""}
    ${bkYN(pre, "past", "過往醫美療程", "療程名稱與大約時間，例：Ultherapy 2025 年")}
    ${bkYN(pre, "allergy", "過敏史", "例：麻醉藥、特定藥物")}
    ${bkYN(pre, "meds", "目前服用藥物", "藥物名稱")}`;
}
function bkTreatList(c){ return [...new Set([...(bk.extra ? [bk.extra] : []), ...(c.treats || []), "還沒決定"])]; }
function viewBooking(p){
  const c = bk && bk.clinic === p.clinic ? clinicOf(bk.clinic) : bkLoad(p);
  if (bk.done) return viewBookDone(c);
  const min = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  let body = "";
  if (bk.step === 1) {
    body = `<div class="bk-f" id="f-concerns"><span class="bk-l">你想改善什麼？<small>可複選</small></span>${bkChips("concerns", [...CONCERNS, "還不確定"], bk.concerns)}<p class="bk-err" data-err="concerns"></p></div>
      <div class="bk-f" id="f-treats"><span class="bk-l">有想做的療程嗎？<small>可複選</small></span>${bkChips("treats", bkTreatList(c), bk.treats)}<p class="bk-err" data-err="treats"></p></div>
      <div class="bk-cta"><button type="button" class="btn rose" data-bkgo="2">下一步 →</button></div>`;
  } else if (bk.step === 2) {
    const sl = bkSlots(c, bk.date);
    const n = +bk.people;
    while (bk.comp.length < n - 1) bk.comp.push(BK_PERSON());
    bk.comp.length = Math.max(0, n - 1);
    body = `<div class="bk-line"><span class="bk-ok">LINE</span><div><b>已連動 LINE 帳號</b><span>${esc(me.name)}・預約確認會用 LINE 通知你</span></div></div>
      <h2 class="bk-sec">預約時間</h2>
      <label class="bk-f" id="f-date"><span class="bk-l">到診日期 <i>*</i></span><input type="date" data-bki="date" data-re="1" value="${esc(bk.date)}" min="${min}"><p class="bk-err" data-err="date"></p></label>
      <div class="bk-f" id="f-time"><span class="bk-l">到診時間 <i>*</i>${sl.guess ? "<small>診療時間以診所確認為準</small>" : ""}</span>
        ${!bk.date ? `<p class="note">請先選擇日期。</p>` : sl.closed ? `<p class="bk-err">這天診所休診，請選擇其他日期。</p>`
          : `<div class="bk-times" role="group" aria-label="到診時間">${sl.slots.map(s => `<button type="button" data-bks="time" data-v="${s}" aria-pressed="${bk.time === s}">${s}</button>`).join("")}</div>`}
        <p class="bk-err" data-err="time"></p></div>
      <label class="bk-f"><span class="bk-l">預約人數</span><select data-bki="people" data-re="1">${[1,2,3,4,5].map(v => `<option value="${v}" ${+bk.people === v ? "selected" : ""}>${v === 1 ? "只有我" : `共 ${v} 人（含我）`}</option>`).join("")}</select></label>
      <h2 class="bk-sec">${n > 1 ? "本人資料" : "預約者資料"}</h2>
      ${bkPerson("", null)}
      ${bk.comp.map((_, i) => `<h2 class="bk-sec">同行者 ${i + 1}</h2>${bkPerson(`comp.${i}.`, bkTreatList(c))}`).join("")}
      <label class="bk-f"><span class="bk-l">其他備註<small>選填</small></span><textarea data-bki="note" maxlength="150" rows="3" placeholder="例：希望同一時段一起看診">${esc(bk.note)}</textarea></label>
      <div class="bk-info"><p>還沒決定療程也沒關係。<br>實際療程會在到診當天由診所醫師諮詢後決定。</p></div>
      <div class="bk-cta two"><button type="button" class="btn light" data-bkgo="1">上一步</button><button type="button" class="btn rose" data-bkgo="3">下一步 →</button></div>`;
  } else {
    const yn = (o, k) => o[k] === "有" ? `有（${esc(o[k + "T"] || "")}）` : esc(o[k]);
    const RI = { "預約診所":"shield", "到診時間":"cal", "預約人數":"list", "改善需求":"tag", "想做的療程":"list", "姓名":"chat", "出生日期":"cal", "過往醫美療程":"list", "過敏史":"shield", "目前服用藥物":"tag", "其他備註":"chat" };
    const row = (l, v) => `<div class="bk-r"><dt>${icon(RI[l] || "list")}<span>${l}</span></dt><dd>${v}</dd></div>`;
    const person = (o, t) => row("姓名", esc(o.name)) + row("出生日期", esc(o.birth.replace(/-/g, "/"))) + (t ? row("想做的療程", esc(t)) : "")
      + row("過往醫美療程", yn(o, "past")) + row("過敏史", yn(o, "allergy")) + row("目前服用藥物", yn(o, "meds"));
    body = `<dl class="bk-sum">
        ${row("預約診所", `${esc(c.name)} · ${esc(c.area)}`)}
        ${row("到診時間", `${esc(bk.date.replace(/-/g, "/"))}（${DAYS[(new Date(bk.date + "T00:00:00").getDay() + 6) % 7]}）${esc(bk.time)}`)}
        ${row("預約人數", bk.people === "1" ? "1 人" : `${bk.people} 人`)}
        ${row("改善需求", esc(bk.concerns.join(" / ")))}
        ${row("想做的療程", esc(bk.treats.join(" / ")))}
      </dl>
      <h2 class="bk-sec">${bk.comp.length ? "本人資料" : "預約者資料"}</h2>
      <dl class="bk-sum">${person(bk)}</dl>
      ${bk.comp.map((o, i) => `<h2 class="bk-sec">同行者 ${i + 1}</h2><dl class="bk-sum">${person(o, o.treats.join(" / "))}</dl>`).join("")}
      ${bk.note ? `<dl class="bk-sum">${row("其他備註", esc(bk.note))}</dl>` : ""}
      ${c.benefit ? `<div class="bk-ben"><span>SKINBRIDGE PRIVILEGE</span><p>本診所享專屬 <b>9折</b> 禮遇</p><small>${esc(c.benefitScope || "實際適用範圍以診所諮詢為準。")}</small></div>` : ""}
      <p class="bk-note">送出後，Skinbridge 會向診所預約這個時間，並透過 LINE 通知你預約結果。若該時段已滿，我們會用 LINE 和你調整時間。</p>
      <label class="agree" id="f-agree"><input type="checkbox" data-bkc="agree" ${bk.agree ? "checked" : ""}><span>我同意 Skinbridge 為安排預約，將以上資料（含所有預約者的療程史、過敏史、用藥）提供給本次預約的診所，並以 LINE 與我聯絡。實際療程由醫師諮詢後判斷。</span></label>
      <p class="bk-err" data-err="agree"></p>
      <div class="bk-cta col"><button type="button" class="btn rose" data-bksend="1">送出預約</button><button type="button" class="btn light" data-bkgo="2">返回修改</button></div>`;
  }
  return `<div class="view bk" id="bk">${bkHead(c, bk.step)}<div class="bk-body">${body}</div></div>`;
}
function viewBookDone(c){
  return `<div class="view bk" id="bk">${bkHead(c, 0)}
    <div class="done bk-done">
      <h3>預約已送出</h3>
      <p>Skinbridge 會向診所預約你選的時間，<br>完成後透過 LINE 通知你預約結果。</p>
      ${me && me.friend ? "" : `<p class="note">請先加入 Skinbridge LINE 好友，才收得到預約通知。</p><a class="btn line" href="${friendUrl()}" target="_blank" rel="noopener">加入 LINE 好友</a>`}
      <div class="acts"><a class="btn rose" href="/apply/?mode=mine">查看我的預約</a><a class="btn light" href="/tw/">回到首頁</a></div>
    </div></div>`;
}
function bkCheck(step){
  const errs = {};
  const person = (o, pre) => {
    const id = s => (pre + s).replace(/\./g, "-");
    if (!o.name.trim()) errs[id("name")] = "請填寫姓名";
    if (!o.birth) errs[id("birth")] = "請選擇出生日期";
    ["past", "allergy", "meds"].forEach(k => { if (!o[k]) errs[id(k)] = "請選擇一項"; else if (o[k] === "有" && !String(o[k + "T"] || "").trim()) errs[id(k)] = "請簡單填寫內容"; });
  };
  if (step === 1) {
    if (!bk.concerns.length) errs.concerns = "請至少選一項，不確定可以選「還不確定」";
    if (!bk.treats.length) errs.treats = "請至少選一項，沒決定可以選「還沒決定」";
  }
  if (step === 2) {
    if (!bk.date) errs.date = "請選擇到診日期";
    else if (bkSlots(clinicOf(bk.clinic), bk.date).closed) errs.date = "這天診所休診，請選擇其他日期";
    if (!bk.time) errs.time = "請選擇到診時間";
    person(bk, "");
    bk.comp.forEach((o, i) => { person(o, `comp.${i}.`); if (!o.treats.length) errs[`comp-${i}-treats`] = "請至少選一項，沒決定可以選「還沒決定」"; });
  }
  if (step === 3 && !bk.agree) errs.agree = "請勾選同意事項後再送出";
  document.querySelectorAll("[data-err]").forEach(p => p.textContent = errs[p.dataset.err] || "");
  const first = Object.keys(errs)[0];
  if (first) { const el = document.getElementById("f-" + first); if (el) el.scrollIntoView({ block: "center" }); }
  return !first;
}
function bkBlock(){
  const kday = ["일","월","화","수","목","금","토"];
  const d = bk.date ? new Date(bk.date + "T00:00:00") : null;
  const ko = v => (BK_YN.find(x => x[0] === v) || ["", v])[1];
  const yn = (o, k) => ko(o[k]) + (o[k] === "有" ? `（${o[k + "T"]}）` : "");
  const when = d ? `${d.getMonth() + 1}/${d.getDate()}(${kday[d.getDay()]}) ${bk.time}` : "";
  const one = (o, t, head) => [
    ...(head ? [head] : []),
    `① 顧客姓名 고객성함: ${o.name.trim()}`,
    `② 出生日期 생년월일: ${o.birth.replace(/-/g, "/")}`,
    `③ 預約時間 예약시간: ${when}`,
    `④ 過往療程 과거시술이력: ${yn(o, "past")}`,
    `⑤ 過敏史 알레르기: ${yn(o, "allergy")}`,
    `⑥ 目前服用藥物 복용중인약: ${yn(o, "meds")}`,
    `*관심시술: ${t}`
  ].join("\n");
  const n = bk.comp.length + 1;
  return [
    one(bk, bk.treats.join(" / "), n > 1 ? "【본인】" : ""),
    ...bk.comp.map((o, i) => one(o, o.treats.join(" / "), `【동행 ${i + 1}】`)),
    `*고민: ${bk.concerns.join(" / ")}`,
    `*특별사항: ${n > 1 ? `${n}명 동반 예약` : "본인 1명"}${bk.note ? " / " + bk.note : ""}`,
    ...(clinicOf(bk.clinic).benefit ? ["*9折 적용 병원"] : [])
  ].join("\n\n").replace(/\n\n(\*)/g, "\n$1");
}
function setupBooking(){
  const box = document.getElementById("bk");
  if (!box || box.dataset.on) return;
  box.dataset.on = "1";
  const rerender = () => { const y = scrollY; $("#app").innerHTML = viewApply(); setupBooking(); scrollTo(0, y); };
  box.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.bkm) {
      const k = b.dataset.bkm, v = b.dataset.v, a = bkGet(k);
      const none = v === "還不確定" || v === "還沒決定";
      if (a.includes(v)) a.splice(a.indexOf(v), 1);
      else { if (none) a.length = 0; else { const i = a.findIndex(x => x === "還不確定" || x === "還沒決定"); if (i >= 0) a.splice(i, 1); } a.push(v); }
      box.querySelectorAll(`[data-bkm="${k}"]`).forEach(x => x.setAttribute("aria-pressed", a.includes(x.dataset.v)));
      bkSave(); return;
    }
    if (b.dataset.bks) { bkSet(b.dataset.bks, b.dataset.v); bkSave(); rerender(); return; }
    if (b.dataset.bkgo) {
      const to = +b.dataset.bkgo;
      if (to > bk.step && !bkCheck(bk.step)) return;
      bk.step = to; bkSave(); $("#app").innerHTML = viewApply(); setupBooking(); scrollTo(0, 0); return;
    }
    if (b.dataset.bksend) {
      if (!bkCheck(3)) return;
      const c = clinicOf(bk.clinic);
      b.disabled = true; b.textContent = "送出中…";
      const n = bk.comp.length + 1;
      const data = { type: c.benefit ? "9折預約" : "預約", clinic: c.name,
        item: bk.treats.join(" / ") + (n > 1 ? `｜共 ${n} 人` : ""),
        date: bk.date, time: bk.time, name: bk.name.trim() + (n > 1 ? ` 外 ${n - 1} 人` : ""), year: bk.birth.replace(/-/g, "/"), ig: "",
        concern: bkBlock(), userId: me.userId, lineName: me.name };
      if (SHEET_URL && me.userId !== "DEMO-USER") {
        try { await fetch(SHEET_URL, { method:"POST", mode:"no-cors", body:new URLSearchParams(data) }); } catch (_) {}
      }
      bk.done = true; try { sessionStorage.removeItem(bkKey(bk.clinic)); } catch (_) {}
      $("#app").innerHTML = viewApply(); setupBooking(); scrollTo(0, 0);
    }
  });
  box.addEventListener("input", e => { const k = e.target.dataset.bki; if (k && !e.target.dataset.re) { bkSet(k, e.target.value); bkSave(); } });
  box.addEventListener("change", e => {
    const k = e.target.dataset.bki;
    if (k) {
      bkSet(k, e.target.value);
      if (k === "date") bk.time = "";
      bkSave();
      if (e.target.dataset.re) rerender();
    }
    if (e.target.dataset.bkc) { bk[e.target.dataset.bkc] = e.target.checked; bkSave(); }
  });
}

/* ===== LINE 로그인 (LIFF) ===== */
let me = null;   // { userId, name, friend }
let liffOk = false; // LIFF 를 쓸 수 있는 곳(skinbridgekorea.com/apply/)에서만 true
const friendUrl = () => "https://line.me/R/ti/p/" + encodeURIComponent(LINE_ID);
const store = {
  get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch (_) { return null; } },
  set(k, v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
  del(k){ try { sessionStorage.removeItem(k); } catch (_) {} }
};
function loadLiff(){
  return new Promise((ok, fail) => {
    if (window.liff) return ok();
    const s = document.createElement("script");
    s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}
async function initLine(){
  if (!LIFF_ID) return;
  try {
    await loadLiff();
    await liff.init({ liffId: LIFF_ID });
    liffOk = true;
    if (liff.isLoggedIn()) {
      const p = await liff.getProfile();
      let friend = false;
      try { friend = (await liff.getFriendship()).friendFlag; } catch (_) {}
      me = { userId: p.userId, name: p.displayName, friend, idToken: liff.getIDToken() };
    }
  } catch (_) { /* LINE 로그인을 쓸 수 없으면 둘러보기는 그대로 */ }
  route();
}
function lineLogin(){
  if (!liffOk && !IS_SITE) {    // 미리보기 등 홈페이지 밖에서는 시연
    me = { userId: "DEMO-USER", name: "示範用戶", friend: false };
    route(); return;
  }
  if (!liffOk) {                 // 홈페이지인데 LINE 로그인을 못 불러온 경우
    $("#lineLogin").outerHTML = `<p class="err">LINE 登入暫時無法使用，請直接<a class="link" href="${friendUrl()}" target="_blank" rel="noopener">加入 LINE 好友</a>聯繫我們。</p>`;
    return;
  }
  if (!window.liff) { $("#lineLogin").textContent = "LINE 載入中，請稍候再試"; return; }
  liff.login({ redirectUri: location.href.split("#")[0] });
}

function setupForm(){
  const login = $("#lineLogin");
  if (login) { login.addEventListener("click", lineLogin); return; }
  if (document.getElementById("bk")) { setupBooking(); return; }

  let type = (state.prefill && state.prefill.type) || "booking";
  const fClinic = $("#fClinic"), fItem = $("#fItem"), fW1 = $("#fWish1"), fW2 = $("#fWish2");
  const tierOpt = t => `<option value="${tierKey(t)}">${tierLabel(t)}${t.influencer ? "（網紅限定）" : ""}</option>`;
  const tierOf = (k, key) => k && k.tiers.find(t => tierKey(t) === key);
  function needIg(){
    const k = campOf(fClinic.value);
    const req = type === "camp" && [fW1.value, fW2.value].some(key => tierOf(k, key)?.influencer);
    $("#igReq").innerHTML = req ? "<i>*</i>（網紅限定方案必填）" : "";
    return req;
  }
  function fillItems(){
    const c = clinicOf(fClinic.value), k = campOf(c.id);
    const mo = c.monthly || null;
    const evItems = mo ? [
      ...((mo.posters && mo.posters.length) ? [(mo.month || "") + "活動"] : []),
      ...((mo.items || []).map(m => m.n + (m.s ? " " + m.s : "")))
    ] : [];
    const items = [...new Set([...evItems, ...(c.menu || []).map(m => m.n + (m.s ? " " + m.s : "")), "還不確定，想先諮詢"])];
    fItem.innerHTML = `<option value="">請選擇</option>` + items.map(i => `<option>${esc(i)}</option>`).join("");
    fW1.innerHTML = k ? `<option value="">請選擇</option>` + k.tiers.map(tierOpt).join("")
                      : `<option value="">這間診所目前沒有招募中的體驗團</option>`;
    fW2.innerHTML = `<option value="">不需要</option>` + (k ? k.tiers.map(tierOpt).join("") : "");
    const pre = state.prefill || {};
    if (pre.clinic === c.id) {
      if (pre.item && [...fItem.options].some(o => o.value === pre.item)) fItem.value = pre.item;
      if (pre.tier && [...fW1.options].some(o => o.value === pre.tier)) fW1.value = pre.tier;
    }
    $("#itemWrap").hidden = type === "camp";
    $("#wishWrap").hidden = type !== "camp";
    $("#igWrap").hidden = type !== "camp";
    const note = $("#perkNote");
    note.hidden = !(type === "booking" && c.perk);
    note.textContent = c.perk ? `預約諮詢即贈：${c.perk}` : "";
    needIg();
  }
  fW1.addEventListener("change", needIg);
  fW2.addEventListener("change", needIg);
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.type === "booking") { location.href = "/apply/?type=booking&clinic=" + encodeURIComponent(fClinic.value); return; }
    type = b.dataset.type;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    fillItems();
  }));
  fClinic.addEventListener("change", fillItems);
  fillItems();

  $("#form").addEventListener("submit", async e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    const miss = [];
    if (type === "booking" && !v("#fItem")) miss.push("療程");
    if (type === "camp" && !v("#fWish1")) miss.push("第一志願方案");
    if (type === "camp" && needIg() && !v("#fIg")) miss.push("Instagram 帳號");
    if (!v("#fDate")) miss.push("希望日期");
    if (!v("#fTime")) miss.push("希望時段");
    if (!v("#fName")) miss.push("姓名");
    if (!/^(19|20)\d{2}$/.test(v("#fYear"))) miss.push("出生年（4 位數）");
    if (miss.length) { $("#err").textContent = "請填寫：" + miss.join("、"); return; }
    if (type === "camp" && v("#fWish2") && v("#fWish2") === v("#fWish1")) { $("#err").textContent = "第二志願請選擇和第一志願不同的方案，或選「不需要」。"; return; }
    if (!$("#fAgree").checked) { $("#err").textContent = "請勾選同意事項後再送出。"; return; }
    $("#err").textContent = "";

    const c = clinicOf(v("#fClinic")), k = campOf(c.id);

    const item = type === "camp"

    };

    if (SHEET_URL && me.userId !== "DEMO-USER") {   // 시연(미리보기) 신청은 시트에 저장하지 않음

      (me.friend ? "" : `<a class="btn line" href="${friendUrl()}" target="_blank" rel="noopener">加入 LINE 好友</a>`) +
      `<a class="btn light" href="/tw/">回到首頁</a>`;
    $("#form").hidden = true; $("#done").hidden = false;
    $("#done").scrollIntoView({ block:"start" });
  });
}

    <label class="agree"><input type="checkbox" id="rAgree"><span>我同意評價與照片經 Skinbridge 確認後，以遮蔽姓名的方式只公開給已登入的會員。不想露臉可以先遮住眼睛再上傳。</span></label>
    <p class="err" id="rErr" aria-live="polite"></p>
    <button class="btn rose" type="submit" id="rSubmit">送出評價</button>
  </form>`;
  const pick = (inp, img) => $(inp).addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) { $(img).hidden = true; return; }
    $(img).src = URL.createObjectURL(f); $(img).hidden = false;
  });
  pick("#rBefore", "#pBefore"); pick("#rAfter", "#pAfter");
  $("#rClinic").addEventListener("change", e => { const c = list.find(x => x.id === e.target.value); $("#rItem").value = c ? (c.item || "") : ""; });
  $("#rForm").addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("#rText").value.trim();
    if (text.length < 20) { $("#rErr").textContent = "評價內容請寫 20 字以上。"; return; }
    if (!$("#rAgree").checked) { $("#rErr").textContent = "請勾選同意事項後再送出。"; return; }
    $("#rErr").textContent = ""; $("#rSubmit").disabled = true; $("#rSubmit").textContent = "送出中…";
    const shrinkTo = async f => {
      if (!f) return "";
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); });
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      return cv.toDataURL("image/jpeg", 0.82).split(",")[1];
    };
    if (me.userId === "DEMO-USER") { $("#revForm").innerHTML = `<p class="empty">（預覽畫面）正式網站送出後，會在確認後公開給已登入的會員。</p>`; return; }
    try {
      const body = new URLSearchParams({ action:"review", idToken: me.idToken || "", clinic: $("#rClinic").value, item: $("#rItem").value.trim(),
        rating: (document.querySelector('input[name="rRate"]:checked') || {}).value || "5", text,
        before: await shrinkTo($("#rBefore").files[0]), after: await shrinkTo($("#rAfter").files[0]) });
      const r = await fetch(SHEET_URL, { method:"POST", body }); const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      $("#revForm").innerHTML = `<div class="done"><h3>謝謝你的評價</h3><p>Skinbridge 確認後會公開給已登入的會員。</p><a class="btn light" href="/tw/">回到首頁</a></div>`;
    } catch (err) {
      $("#rErr").textContent = "送出失敗，請稍後再試，或直接用 LINE 告訴我們。"; $("#rSubmit").disabled = false; $("#rSubmit").textContent = "送出評價";
    }
  });
}


/* ===== 신청서 화면 ===== */
function setPrefill(){
  const q = new URLSearchParams(location.search);
  const type = q.get("type") === "camp" ? "camp" : "booking";
  const clinic = clinicOf(q.get("clinic") || "") ? q.get("clinic") : "selena";
  state.prefill = { type, clinic, item: q.get("item") || "", tier: q.get("tier") || "" };
}
const MODE = new URLSearchParams(location.search).get("mode");
function route(){ if (MODE === "review") { $("#app").innerHTML = viewReview(); setupReview(); } else if (MODE === "mine") { $("#app").innerHTML = viewMine(); setupMine(); } else { $("#app").innerHTML = viewApply(); setupForm(); } }
loadData().finally(() => { setPrefill(); route(); initLine(); });

</script>
