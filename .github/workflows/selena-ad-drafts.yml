name: SELENA Taiwan ad drafts
on:
  push:
    paths:
      - "selena-ads/data/prices.csv"
      - "selena-ads/data/campaigns.json"
      - "selena-ads/price_uploads/**"
      - "selena-ads/assets/**"
      - "selena-ads/scripts/**"
      - ".github/workflows/selena-ad-drafts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce-reviewable-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow pymupdf
      - name: Verify incoming raw prices without approving them
        run: python selena-ads/scripts/review_prices.py
      - name: Create 15 card drafts in each format
        run: python selena-ads/scripts/generate.py
      - name: Verify output count
        run: |
          test "$(find selena-ads/generated/instagram_4x5 -name '*.png' | wc -l)" -eq 15
          test "$(find selena-ads/generated/threads_square -name '*.png' | wc -l)" -eq 15
      - uses: actions/upload-artifact@v4
        with:
          name: SELENA-draft-cards
          path: selena-ads/generated/
          retention-days: 14
