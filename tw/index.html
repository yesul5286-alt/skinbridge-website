function openLb(urls, start){

    <span class="lb-n"></span>`;
  document.body.appendChild(lb); document.body.style.overflow = "hidden";
  const tr = lb.querySelector(".lb-track"), n = lb.querySelector(".lb-n");
  const upd = () => { n.textContent = `${Math.round(tr.scrollLeft / tr.clientWidth) + 1} / ${urls.length}`; };
  requestAnimationFrame(() => { tr.scrollLeft = tr.clientWidth * start; upd(); });
  tr.addEventListener("scroll", upd, { passive:true });
  const close = () => { lb.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); };
  lb.querySelector(".lb-x").addEventListener("click", close);

let heroTimer = null, heroObs = null;
function setupHero(){
  clearInterval(heroTimer); heroTimer = null;
  if (heroObs) { heroObs.disconnect(); heroObs = null; }
  const mh = document.getElementById("mh");
  if (!mh) return;
  const slides = [...mh.querySelectorAll(".mh-s")], dots = [...mh.querySelectorAll("[data-mdot]")];
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0, seen = true;
  const show = n => {
    i = (n + slides.length) % slides.length;
    slides.forEach((s, k) => {
      const on = k === i; s.classList.toggle("on", on);
      on ? s.removeAttribute("aria-hidden") : s.setAttribute("aria-hidden", "true");
      s.querySelectorAll("a,button").forEach(x => on ? x.removeAttribute("tabindex") : x.setAttribute("tabindex", "-1"));
    });
    dots.forEach((d, k) => k === i ? d.setAttribute("aria-current", "true") : d.removeAttribute("aria-current"));
  };
  const start = () => { clearInterval(heroTimer); heroTimer = null; if (!calm && seen && !document.hidden) heroTimer = setInterval(() => show(i + 1), 5500); };
  mh.heroGo = n => { show(n); start(); }; mh.heroStart = start;
  dots.forEach(d => d.addEventListener("click", () => mh.heroGo(+d.dataset.mdot)));
  let x0 = null, y0 = 0;
  mh.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  mh.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) mh.heroGo(i + (dx < 0 ? 1 : -1));
  });
  mh.addEventListener("pointercancel", () => { x0 = null; });
  mh.addEventListener("keydown", e => { if (e.key === "ArrowRight") mh.heroGo(i + 1); else if (e.key === "ArrowLeft") mh.heroGo(i - 1); });
  if ("IntersectionObserver" in window) {
    heroObs = new IntersectionObserver(([en]) => {
      seen = en.isIntersecting;
      document.body.classList.toggle("past-hero", !seen);
      start();
    }, { threshold: 0.12 });
    heroObs.observe(mh);
  }
  start();
}
document.addEventListener("visibilitychange", () => { const mh = document.getElementById("mh"); if (mh && mh.heroStart) mh.heroStart(); });
function mSheet(open){
  const sh = document.getElementById("msheet"), btn = document.querySelector("[data-mmenu]");
  if (!sh) return;
  sh.hidden = !open;
  if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
  document.body.classList.toggle("sheet-open", open);
  if (open) sh.querySelector(".msheet-x").focus(); else if (btn) btn.focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("sheet-open")) mSheet(false); });

/* ===== 이벤트 ===== */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.mmenu) { mSheet(true); return; }
  if (t.dataset.fav) { const on = favs.toggle(t.dataset.fav); t.setAttribute("aria-pressed", on); t.setAttribute("aria-label", on ? "取消收藏" : "收藏這間診所"); return; }
  if (t.dataset.more) { const el = document.getElementById(t.dataset.more); const open = el.classList.toggle("open"); t.textContent = open ? "收起" : "更多"; t.setAttribute("aria-expanded", open); return; }
  if (t.dataset.fsheet) { state.sheet = t.dataset.fsheet; route(); const b = document.querySelector(".fsheet-l [aria-pressed=true]"); if (b) b.focus(); return; }
  if (t.dataset.fpick) { state.f[t.dataset.fpick] = t.dataset.v; state.sheet = ""; route(); return; }
  if (t.dataset.fsheetx) { const k = state.sheet; state.sheet = ""; route(); const b = document.querySelector(`[data-fsheet="${k}"]`); if (b) b.focus(); return; }
  if (t.dataset.mclose) { mSheet(false); if (t.tagName === "BUTTON") return; }
  if (t.dataset.hscroll) { const el = document.getElementById(t.dataset.hscroll); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  if (t.dataset.gof) { state.f = { area:"", concern:"", treat:"", lang:"", trait:"", camp:false, ben:"", sort:state.f.sort }; state.cq = ""; state.f[t.dataset.gof] = t.dataset.v; go("clinics"); return; }
  if (t.dataset.f) { const k = t.dataset.f; state.f[k] = state.f[k] === t.dataset.v ? "" : t.dataset.v; route(); return; }
  if (t.dataset.fcamp) { state.f.camp = !state.f.camp; route(); return; }
  if (t.dataset.fclear) { state.f = { area:"", concern:"", treat:"", lang:"", trait:"", camp:false, ben:"", sort:state.f.sort }; state.cq = ""; state.dirArea = ""; route(); return; }
  if (t.dataset.dirarea) { state.dirArea = state.dirArea === t.dataset.dirarea ? "" : t.dataset.dirarea; state.dirN = 20; loadDir(); route(); return; }
  if (t.dataset.gp) { gpToggle(t); return; }
  if (t.dataset.copy) { const v = t.dataset.copy; const done = () => { t.textContent = "已複製"; setTimeout(() => { t.textContent = "複製韓文地址"; }, 1800); }; try { navigator.clipboard.writeText(v).then(done, done); } catch (_) { done(); } return; }
  if (t.dataset.dirmore) { state.dirN = (state.dirN || 20) + 20; reroute(); return; }
  if (t.dataset.want) { const r = DIR && DIR.rows.find(x => x[0] === t.dataset.want); if (r && !wants.has(r[0])) { wants.add(r[0]); sendWant({ id:r[0], name:r[1], gu:DIR.gu[r[2]], dong:r[3], src:"list" }); } t.setAttribute("aria-pressed", "true"); t.textContent = "✓ 已收到"; return; }
  if (t.dataset.wantask) { const i = $("#dirAsk"), v = i ? i.value.trim() : ""; if (!v) { if (i) i.focus(); return; } sendWant({ id:"typed", name:v, src:"typed" }); i.value = ""; const d = $("#dirDone"); if (d) d.hidden = false; return; }
  if (t.dataset.region) { state.region = t.dataset.region; route(); }
  else if (t.dataset.cat) { state.cat = t.dataset.cat; route(); }
  else if (t.dataset.gocat) { state.cat = t.dataset.gocat; }
  else if (t.dataset.jump) { jump(t.dataset.jump); return; }
  else if (t.dataset.copy) {
    const txt = document.getElementById(t.dataset.copy).textContent;
    const ok = () => { t.textContent = "已複製"; setTimeout(() => t.textContent = "複製", 1500); };
    navigator.clipboard ? navigator.clipboard.writeText(txt).then(ok).catch(() => {}) : null;
    return;
  }
  else if (t.matches("a.camp")) { state.jump = "camp"; }
  else if (t.dataset.apply) {
    const qs = new URLSearchParams({ type: t.dataset.apply, clinic: t.dataset.clinic });
    if (t.dataset.item) qs.set("item", t.dataset.item);
    if (t.dataset.tier) qs.set("tier", t.dataset.tier);
    location.href = "/apply/?" + qs;
    return;
  }
  const href = t.getAttribute("href");
  if (t.tagName === "A" && href && href.startsWith("#")) { e.preventDefault(); go(href.slice(1)); }
});
document.addEventListener("click", e => {
  if (e.target.classList && e.target.classList.contains("fsheet")) { state.sheet = ""; route(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.sheet) { const k = state.sheet; state.sheet = ""; route(); const b = document.querySelector(`[data-fsheet="${k}"]`); if (b) b.focus(); }
});
document.addEventListener("compositionend", e => { if (e.target.id === "q" || e.target.id === "cq") e.target.dispatchEvent(new Event("input", { bubbles: true })); });
document.addEventListener("focusin", e => { if (e.target.id === "cq") loadDir(); });
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q" || id === "cq") {
    if (e.isComposing) return;
    state[id] = e.target.value;
    if (id === "cq") { state.dirN = 20; if (e.target.value.trim()) loadDir(); }
    const pos = e.target.selectionStart;
    route();
    const q = $("#" + id); q.focus(); q.setSelectionRange(pos, pos);
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "hsearch") return;
  e.preventDefault();
  state.f = { area:"", concern:"", treat:"", lang:"", trait:"", camp:false, ben:"", sort:state.f.sort };
  state.cq = $("#hq").value; go("clinics");
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.fsel; if (!k) return;
  state.f[k] = e.target.value; route();
});
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h !== cur) { cur = h; route(); scrollTo(0, 0); }
});

try { const pend = sessionStorage.getItem("sb-rev"); if (pend) { sessionStorage.removeItem("sb-rev"); cur = pend; state.jump = "review"; } } catch (_) {}
route();
loadData().then(ok => { if (ok) route(); });
</script>
</body>
