<script>
/* ===== 화면 ===== */
const HOME = {
  hero: "https://www.skinbridgekorea.com/tw/img/ajour/interior-5.webp",
  curated: [
    { en:"NATURAL LIFTING", zh:"自然拉提", img:"https://www.skinbridgekorea.com/tw/img/ajour/interior-9.webp", key:"concern", v:"拉提" },
    { en:"SKIN TEXTURE", zh:"毛孔・膚質", img:"https://www.skinbridgekorea.com/tw/img/drtunes/interior-3.webp", key:"concern", v:"毛孔" },
    { en:"SKIN BOOSTER", zh:"水光療程", img:"https://www.skinbridgekorea.com/tw/img/ajour/interior-6.webp", key:"treat", v:"水光" },
    { en:"ANTI-AGING", zh:"抗老緊緻", img:"https://www.skinbridgekorea.com/tw/img/drtunes/interior-7.webp", key:"concern", v:"彈力" }
  ],
  why: [
    ["shield", "嚴選<br>合作診所", "親自拜訪、比較後才邀請合作，不是付費就能刊登。"],
    ["user", "醫師專業與<br>溝通度評估", "確認醫師經歷與諮詢方式，重視能好好說明的診所。"],
    ["list", "療程規劃<br>與風險管理", "協助整理療程選擇與注意事項，最終由醫師評估是否適合。"],
    ["chat", "外國旅客<br>一站式支援", "從諮詢、預約到到診當天，全程中文協助。"]
  ]
};
const LI = {
  shield: '<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
  user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/>',
  list: '<path d="M8 6h11M8 12h11M8 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/>',
  chat: '<path d="M5 5h14v10H9l-4 4z"/>',
  price: '<path d="M4 12l8-8h7v7l-8 8z"/><circle cx="15" cy="8" r="1.2"/>'
};
const lic = k => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${LI[k]}</svg>`;
function selCard(c){
  const img = (c.interior && c.interior[0]) || (c.photos && c.photos[0]) || "";
  const cats = (c.concerns || []).slice(0, 3);
  const REG = { "首爾":"SEOUL", "濟州":"JEJU", "釜山":"BUSAN", "大邱":"DAEGU" };
  return `<a class="scard" href="#c-${c.id}">
    <div class="scard-img">${img ? `<img src="${esc(img)}" alt="${esc(c.name)}" loading="lazy">` : `<div class="ph ${c.tone}"></div>`}</div>
    <div class="scard-bd">
      <span class="scard-loc">${REG[c.region] || esc(c.region)} · ${esc(c.area)}</span>
      <h3>${esc(c.name)}</h3>
      ${c.oneliner ? `<p>${esc(c.oneliner)}</p>` : ""}
      ${cats.length ? `<div class="scard-cat">${cats.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
      <div class="scard-ft"><div><span class="partner">SKINBRIDGE PARTNER</span>${c.benefit ? `<span class="benefit">全療程 <em>9折</em> 專屬禮遇</span>` : ""}</div><span class="arr" aria-hidden="true">→</span></div>
    </div></a>`;
}
function viewHome(){
  const rec = CLINICS.slice().sort((a, b) => (b.selected ? 1 : 0) - (a.selected ? 1 : 0)).slice(0, 4);
  const open = openCamps().sort((a, b) => daysLeft(a.end) - daysLeft(b.end));
  const regions = [...new Set(CLINICS.map(c => c.region))].map(r => ({ "首爾":"SEOUL", "濟州":"JEJU", "釜山":"BUSAN", "大邱":"DAEGU" }[r] || r)).join(" · ");
  return `<div class="view home2">
    <section class="h-hero">
      <div class="h-hero-img"><img src="${HOME.hero}" alt="合作診所空間" fetchpriority="high"></div>
      <div class="h-hero-tx">
        <span class="disp-s line">CURATED KOREAN AESTHETICS</span>
        <h1>精選韓國醫美，<br>找到真正適合你的選擇。</h1>
        <span class="disp-s reg">${regions}</span>
        <p class="h-sub">診所精選 / 療程規劃 / 預約諮詢 / 中文支援</p>
        <a class="h-cta" href="#clinics">探索診所 <span aria-hidden="true">→</span></a>
      </div>
    </section>
    <ul class="trust">
      <li>${lic("shield")}<span>精選合作診所</span></li>
      <li>${lic("user")}<span>醫師專業評估</span></li>
      <li>${lic("price")}<span>價格透明</span></li>
      <li>${lic("chat")}<span>中文全程支援</span></li>
    </ul>
    <form class="search big" id="hsearch" role="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="hq" type="search" placeholder="搜尋診所、療程或肌膚問題" aria-label="搜尋診所"><button type="submit" class="sgo" aria-label="搜尋">→</button></form>
    <section class="h-sec">
      <div class="h-head"><span class="disp">CURATED BY SKINBRIDGE</span><div class="row2"><p>依照你的需求，精選適合的療程與診所。</p><a class="more" href="#guide">查看全部 →</a></div></div>
      <div class="cur">${HOME.curated.map(x => `<button type="button" class="cur-t" data-gof="${x.key}" data-v="${esc(x.v)}">
        <span class="cur-img"><img src="${x.img}" alt="" loading="lazy"></span>
        <span class="disp-s">${x.en}</span><b>${x.zh}</b></button>`).join("")}</div>
    </section>
    <section class="why">
      <span class="disp big">WHY<br>SKINBRIDGE</span>
      <ul class="why-l">${HOME.why.map(([ic, t, d]) => `<li title="${d.replace(/<br>/g, "")}">${lic(ic)}<b>${t}</b></li>`).join("")}</ul>
    </section>
    <section class="h-sec">
      <div class="h-head row2"><div class="sel-t"><span class="disp">SELECTED CLINICS</span><span class="sel-zh">精選合作診所</span></div><a class="more" href="#clinics">查看全部 →</a></div>
      <div class="scards">${rec.map(selCard).join("")}</div>
    </section>
    ${open.length ? section("EXPERIENCE", "招募中的體驗團", "#camps", `<div class="row">${open.map(campCard).join("")}</div>`) : ""}
  </div>`;
}

const GUIDE = {
  "拉提": "改善臉部鬆弛與輪廓線條的療程，常見有音波（Ultherapy 等）、電波（Thermage 等）與埋線。",
  "毛孔": "針對毛孔粗大與膚質不均，常見有微針電波、雷射與皮膚管理。",
  "痘痘": "針對發炎痘痘與出油，常見有痘痘處置、煥膚、抑制皮脂的光電療程。",
  "痘疤": "針對凹洞與痘疤痕跡，常見有微針電波、飛梭雷射等，通常需要多次療程。",
  "色素": "針對斑點、膚色不均，常見有皮秒雷射、IPL 與美白管理。",
  "輪廓": "針對臉型線條，常見有肉毒、填充、溶脂與抽脂。",
  "皺紋": "針對表情紋與細紋，常見有肉毒、玻尿酸與膠原增生療程。",
  "彈力": "針對肌膚緊緻度，常見有電波、水光與膠原增生療程。",
  "身體雕塑": "針對身體線條，常見有抽脂、溶脂針與身體電波。"
};
function viewGuide(){
  return `<div class="view">
    <div class="sh" style="border:0;padding:0"><div><span class="en">TREATMENT GUIDE</span><h2>療程指南</h2></div></div>
    <p class="note" style="margin:-10px 0 0">依肌膚問題整理常見療程類型，實際適合的療程需由醫師評估。</p>
    <div class="guide">${CONCERNS.map(x => { const n = CLINICS.filter(c => (c.concerns || []).includes(x)).length; return `<article class="g-item">
      <h3>${esc(x)}</h3><p>${esc(GUIDE[x] || "")}</p>
      ${n ? `<button type="button" class="link" data-gof="concern" data-v="${esc(x)}">查看 ${n} 間診所 →</button>` : `<span class="note">合作診所準備中</span>`}
    </article>`; }).join("")}</div>
  </div>`;
}
function viewBook(){
  const line = "https://line.me/R/ti/p/" + encodeURIComponent(LINE_ID);
  return `<div class="view">
    <div class="sh" style="border:0;padding:0"><div><span class="en">BOOKING</span><h2>預約諮詢</h2></div></div>
    <ol class="steps">
      <li><b>選擇診所與療程</b><span>在「找診所」比較合作診所，或直接告訴我們你的需求。</span></li>
      <li><b>LINE 中文諮詢</b><span>Skin Bridge 以中文協助確認療程、價格與可預約日期。</span></li>
      <li><b>診所確認後到診</b><span>預約確定後以 LINE 通知，到診當天直接前往診所。</span></li>
    </ol>
    <div class="cta-col">
      <a class="btn rose" href="${line}" target="_blank" rel="noopener">LINE 預約諮詢</a>
      <a class="btn light" href="#clinics">先看看診所</a>
    </div>
  </div>`;
}
function viewMe(){
  const line = "https://line.me/R/ti/p/" + encodeURIComponent(LINE_ID);
  return `<div class="view">
    <div class="sh" style="border:0;padding:0"><div><span class="en">MY PAGE</span><h2>我的</h2></div></div>
    <p class="note" style="margin:-10px 0 0">Skin Bridge 使用 LINE 登入，預約紀錄與通知都會在 LINE 聊天室中。</p>
    <div class="mlist">
      <a href="${line}" target="_blank" rel="noopener"><b>我的預約與諮詢</b><span>在 LINE 聊天室查看與修改</span></a>
      <a href="/apply/?mode=review"><b>撰寫評價</b><span>到診後分享你的經驗</span></a>
      <a href="#camps"><b>體驗團</b><span>查看招募中的體驗團</span></a>
    </div>
  </div>`;
}

function viewCamps(){
  const list = openCamps().filter(k => (state.region === "全部" || clinicOf(k.clinic).region === state.region) && (state.cat === "全部" || k.cats.includes(state.cat)))
    .sort((a,b) => daysLeft(a.end) - daysLeft(b.end));
  return `<div class="view">
    <div class="sh" style="border:0;padding:0"><div><span class="en">EXPERIENCE</span><h2>全部體驗團</h2></div></div>
    ${chips(REGIONS, state.region, "region")}
    ${chips(CATS, state.cat, "cat")}
    ${list.length ? `<div class="grid">${list.map(campCard).join("")}</div>` : `<p class="empty">這個條件目前沒有招募中的體驗團，可以先看看其他地區，或直接預約診所諮詢。</p>`}
  </div>`;
}

const areasOf = () => [...new Set(CLINICS.map(c => c.area).filter(Boolean))];
const tagsOf = c => [...(c.concerns || []), ...(c.treats || [])];
function clinicRow(c){
  const k = campOf(c.id);
  const img = c.photos && c.photos.length ? c.photos[0] : "";
  const langs = LANGS.filter(([, ch]) => (c.langs || "").includes(ch)).map(([n]) => n);
  const tags = tagsOf(c).slice(0, 3);
  return `<a class="crow" href="#c-${c.id}">
    ${img ? `<div class="crow-img"><img src="${esc(img)}" alt="${esc(c.name)}" loading="lazy"></div>`
      : c.logo ? `<div class="crow-img logo"><img src="${esc(c.logo)}" alt="${esc(c.name)}" loading="lazy"></div>`
      : `<div class="crow-img ph ${c.tone}"></div>`}
    <div class="crow-bd">
      <div class="crow-top"><span class="loc">${esc(c.area || c.region)}</span>${c.selected ? `<span class="bdg sel">★ SELECTED</span>` : ""}${k ? `<span class="bdg camp">EXPERIENCE OPEN</span>` : ""}</div>
      <div class="n">${esc(c.name)}${exTag(c)}</div>
      ${c.oneliner ? `<div class="one">${esc(c.oneliner)}</div>` : ""}
      ${tags.length ? `<div class="tg">${tags.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
      ${langs.length ? `<div class="lg">${langs.join("・")}諮詢</div>` : ""}
    </div></a>`;
}
function fchips(list, key, label){
  const v = state.f[key];
  return `<div class="frow"><span class="flab">${label}</span><div class="chips">${list.map(x =>
    `<button class="chip ${x === v ? "on" : ""}" data-f="${key}" data-v="${esc(x)}" aria-pressed="${x === v}">${esc(x)}</button>`).join("")}</div></div>`;
}
function fsel(key, opts, label){
  const v = state.f[key];
  return `<label class="fsel"><span class="sr-only">${label}</span><select data-fsel="${key}">
    <option value="">${label}</option>${opts.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
}
function viewClinics(){
  const f = state.f, q = state.cq.trim().toLowerCase();
  const hay = c => [c.name, c.region, c.area, c.address, c.oneliner || "", ...c.tags, ...tagsOf(c), ...(c.traits || []), ...(c.fields || []), ...c.menu.map(m => m.n)].join(" ").toLowerCase();
  let list = CLINICS.filter(c =>
    (!q || hay(c).includes(q)) &&
    (!f.area || c.area === f.area) &&
    (!f.concern || (c.concerns || []).includes(f.concern)) &&
    (!f.treat || (c.treats || []).includes(f.treat)) &&
    (!f.lang || (c.langs || "").includes((LANGS.find(l => l[0] === f.lang) || ["", "?"])[1])) &&
    (!f.trait || (c.traits || []).includes(f.trait)) &&
    (!f.camp || campOf(c.id)));
  list = f.sort === "new" ? list.slice().reverse() : list.slice().sort((a, b) => (b.selected ? 1 : 0) - (a.selected ? 1 : 0));
  const any = q || f.area || f.concern || f.treat || f.lang || f.trait || f.camp;
  return `<div class="view">
    <div class="sh" style="border:0;padding:0"><div><span class="en">PARTNER CLINICS</span><h2>找診所</h2></div></div>
    <p class="note" style="margin:-6px 0 0">所有診所皆為 Skin Bridge 合作夥伴，可用中文預約諮詢。</p>
    <label class="search"><input id="cq" type="search" placeholder="搜尋診所、療程、膚況（例：Ulthera、毛孔、弘大）" value="${esc(state.cq)}" aria-label="搜尋診所"><span aria-hidden="true">→</span></label>
    ${fchips(CONCERNS, "concern", "膚況")}
    ${fchips(areasOf(), "area", "地區")}
    ${fchips(TREATS, "treat", "療程")}
    <div class="fbar">
      <label class="fsel"><span class="sr-only">排序</span><select data-fsel="sort"><option value="rec" ${f.sort !== "new" ? "selected" : ""}>推薦排序</option><option value="new" ${f.sort === "new" ? "selected" : ""}>最新加入</option></select></label>
      ${fsel("lang", LANGS.map(l => l[0]), "語言")}
      ${fsel("trait", TRAITS, "診所特色")}
      <button class="chip ${f.camp ? "on" : ""}" data-fcamp="1" aria-pressed="${f.camp}">體驗團招募中</button>
      ${any ? `<button class="chip clear" data-fclear="1">清除條件</button>` : ""}
    </div>
    <p class="cnt-line"><span class="num">${list.length}</span> 間診所</p>
    ${list.length ? `<div class="crows">${list.map(clinicRow).join("")}</div>`
      : `<p class="empty">找不到符合條件的診所。可以減少篩選條件，或直接用 LINE 告訴我們你的需求，我們幫你推薦。</p>`}
  </div>`;
}

function viewClinic(c){
  const k = campOf(c.id);
  const sec = (id, en, title, body) => `<section class="dsec" id="s-${id}"><span class="en">${en}</span><h2>${title}</h2>${body}</section>`;

  const feats = c.features && c.features.length
    ? `<ul class="feats">${c.features.map(f => `<li>${icon(f.icon)}<span>${esc(f.label)}</span></li>`).join("")}</ul>` : "";
  const intro = c.intro ? `<p class="intro">${esc(c.intro).replace(/\n/g, "<br>")}</p>` : `<p class="intro">${esc(c.about)}</p>`;

/* ===== 후기·전후 사진 (LINE 로그인한 사람만) ===== */
let viewer = null;          // { idToken, name }
let viewerP = null;
const onSite = () => typeof IS_SITE !== "undefined" && IS_SITE;
function lineSdk(){
  return new Promise((ok, no) => {
    if (window.liff) return ok();
    const s = document.createElement("script"); s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
}
function viewerReady(){
  if (viewerP) return viewerP;
  viewerP = (async () => {
    if (!onSite() || !LIFF_ID) return null;
    try {
      await lineSdk(); await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) { const p = await liff.getProfile(); viewer = { idToken: liff.getIDToken(), name: p.displayName }; }
    } catch (_) {}
    return viewer;
  })();
  return viewerP;
}
function revLocked(msg){
  return `<div class="rev-lock">
    <div class="rev-ghost" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="rev-lock-msg"><b>登入後查看評價與前後對比照片</b>
      <p>${msg || "依韓國醫療相關法規，療程評價與前後對比照片僅提供已登入的會員參考。"}</p>
      <button type="button" class="btn line sm" data-revlogin="1">用 LINE 登入查看</button></div></div>`;
}
function revCard(r){
  return `<article class="rev">
    <div class="rev-h"><span class="rev-star" aria-label="${r.rating} 顆星">${stars(r.rating)}</span><span class="muted">${esc(r.name)}・${esc(r.at)}</span></div>
    ${r.item ? `<div class="rev-item">${esc(r.item)}</div>` : ""}
    <p class="rev-t">${esc(r.text).replace(/\n/g, "<br>")}</p>
    ${r.before || r.after ? `<div class="ba">${r.before ? `<figure><img src="${r.before}" alt="療程前"><figcaption>BEFORE</figcaption></figure>` : ""}${r.after ? `<figure><img src="${r.after}" alt="療程後"><figcaption>AFTER</figcaption></figure>` : ""}</div>` : ""}
  </article>`;
}
async function loadReviews(){
  const box = document.getElementById("revBox"); if (!box) return;
  const id = box.dataset.clinic;
  const write = `<a class="link rev-write" href="/apply/?mode=review&clinic=${encodeURIComponent(id)}">到診過了嗎？撰寫評價 →</a>`;
  if (!onSite()) { box.innerHTML = revLocked("（預覽畫面：正式網站登入 LINE 後會顯示評價。）") + write; return; }
  box.innerHTML = `<p class="note">載入中…</p>`;
  const v = await viewerReady();
  if (!v) { box.innerHTML = revLocked() + write; return; }
  try {
    const r = await fetch(SHEET_URL, { method:"POST", body:new URLSearchParams({ action:"reviews", clinic:id, idToken:v.idToken }) });
    const j = await r.json();
    if (!j.ok) { box.innerHTML = revLocked("登入已過期，請重新登入。") + write; return; }
    const cl = clinicOf(id), g = cl && cl.gated && cl.gated.length ? cl.gated : null;
    const gBox = g ? `<h3 class="sub-h">診所提供・療程前後對比</h3><div class="posters gated">${g.map((u, i) => `<a class="poster" href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="診所提供資料 ${i + 1}" loading="lazy"></a>`).join("")}</div><p class="note">以上為診所提供資料，療程效果因人而異。</p>` : "";
    box.innerHTML = gBox + (j.reviews.length
      ? `<div class="revs">${j.reviews.map(revCard).join("")}</div><p class="note">評價為到診顧客個人感受，療程效果因人而異。</p>`
      : `<p class="empty">還沒有評價。</p>`) + write;
  } catch (_) { box.innerHTML = `<p class="empty">評價暫時無法載入，請稍後再試。</p>` + write; }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-revlogin]"); if (!b) return;
  if (!onSite()) return;
  b.textContent = "開啟 LINE 中…";
  try { sessionStorage.setItem("sb-rev", cur); } catch (_) {}
  try { await lineSdk(); await liff.init({ liffId: LIFF_ID }); liff.login({ redirectUri: location.href.split("#")[0] }); }
  catch (_) { b.textContent = "LINE 登入暫時無法使用"; }
});

function openLb(urls, start){
  const lb = document.createElement("div");
  lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
  lb.innerHTML = `<button type="button" class="lb-x" aria-label="關閉">✕</button>
    <div class="lb-track">${urls.map(u => `<img src="${u}" alt="">`).join("")}</div>
    <span class="lb-n"></span>`;
  document.body.appendChild(lb); document.body.style.overflow = "hidden";
  const tr = lb.querySelector(".lb-track"), n = lb.querySelector(".lb-n");
  const upd = () => { n.textContent = `${Math.round(tr.scrollLeft / tr.clientWidth) + 1} / ${urls.length}`; };
  requestAnimationFrame(() => { tr.scrollLeft = tr.clientWidth * start; upd(); });
  tr.addEventListener("scroll", upd, { passive:true });
  const close = () => { lb.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); };
  lb.querySelector(".lb-x").addEventListener("click", close);
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", key);
  lb.querySelector(".lb-x").focus();
}
/* 체험단 단계의 대상 시술: 전체 / 목록(길면 접기) */
function tierScope(x, k){
  if (x.all) return `<div class="tt">全療程適用</div>`;
  const list = String(x.items || "").split(/\n|、|,|，/).map(s => s.trim()).filter(Boolean);
  if (!list.length) return `<div class="tt">${esc(k.target)}</div>`;
  if (list.length <= 3) return `<div class="tt">${list.map(esc).join("・")}</div>`;
  return `<div class="tt">${list.slice(0, 3).map(esc).join("・")}</div>
    <details class="tdet"><summary>等 ${list.length} 項療程</summary><ul>${list.map(s => `<li>${esc(s)}</li>`).join("")}</ul></details>`;
}
function setupDetail(){
  loadReviews();
  const g = document.getElementById("gallery");
  if (g) g.addEventListener("click", e => { const s = e.target.closest("[data-lb]"); if (s) openLb([...g.querySelectorAll("img")].map(i => i.src), +s.dataset.lb); });
  const tabs = [...document.querySelectorAll(".dtabs [data-jump]")];
  if (!tabs.length) return;
  const hd = document.querySelector(".hd");
  if (hd) document.documentElement.style.setProperty("--hd-h", hd.offsetHeight + "px");
  const secs = tabs.map(b => document.getElementById("s-" + b.dataset.jump));
  const mark = id => tabs.forEach(b => b.classList.toggle("on", b.dataset.jump === id));
  const onScroll = () => {
    const y = document.querySelector(".dtabs").getBoundingClientRect().bottom + 8;
    let curId = "info";
    secs.forEach(s => { if (s && s.getBoundingClientRect().top <= y) curId = s.id.slice(2); });
    mark(curId);
  };
  window.onscroll = onScroll;
  if (state.jump) { const id = state.jump; state.jump = null; requestAnimationFrame(() => jump(id)); }
}
function jump(id){
  const s = document.getElementById("s-" + id), bar = document.querySelector(".dtabs");
  if (!s) return;
  const hd = document.querySelector(".hd");
  const y = s.getBoundingClientRect().top + scrollY - (hd ? hd.offsetHeight : 0) - (bar ? bar.offsetHeight : 0) + 2;
  scrollTo({ top: y, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

/* ===== 라우팅 ===== */
let cur = location.hash.slice(1);
function go(h){
  cur = h;
  try { if (location.hash.slice(1) !== h) location.hash = h; } catch (_) {}
  route(); scrollTo(0, 0);
}
function route(){
  const h = cur;
  let html, nav = "", bar = "";
  if (h === "camps") { html = viewCamps(); nav = "home"; }
  else if (h === "guide") { html = viewGuide(); nav = "guide"; }
  else if (h === "book") { html = viewBook(); nav = "book"; }
  else if (h === "me") { html = viewMe(); nav = "me"; }
  else if (h === "clinics") { html = viewClinics(); nav = "clinics"; }
  else if (h.startsWith("c-") && clinicOf(h.slice(2))) {
    const c = clinicOf(h.slice(2)); html = viewClinic(c); nav = "clinics";
    const hasCamp = openCamps().some(k => k.clinic === c.id);
    bar = (hasCamp ? `<button class="btn light" data-apply="camp" data-clinic="${c.id}">報名體驗團</button>` : "") +
          `<button class="btn rose wide" data-apply="booking" data-clinic="${c.id}">LINE 預約諮詢</button>`;
  }
  else { html = viewHome(); nav = "home"; }
  const bn = document.getElementById("bnav");
  if (bn) bn.hidden = !!bar || h === "apply" || h === "review";
  document.body.classList.toggle("has-bnav", !!bn && !bn.hidden);
  window.onscroll = null;
  document.body.classList.toggle("appmode", h.startsWith("c-") && !!clinicOf(h.slice(2)));
  $("#app").innerHTML = html;
  $("#barIn").innerHTML = bar;
  $("#bar").hidden = !bar;
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));
  setupDetail();
}

/* ===== 이벤트 ===== */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.gof) { state.f = { area:"", concern:"", treat:"", lang:"", trait:"", camp:false, sort:state.f.sort }; state.cq = ""; state.f[t.dataset.gof] = t.dataset.v; go("clinics"); return; }
  if (t.dataset.f) { const k = t.dataset.f; state.f[k] = state.f[k] === t.dataset.v ? "" : t.dataset.v; route(); return; }
  if (t.dataset.fcamp) { state.f.camp = !state.f.camp; route(); return; }
  if (t.dataset.fclear) { state.f = { area:"", concern:"", treat:"", lang:"", trait:"", camp:false, sort:state.f.sort }; state.cq = ""; route(); return; }
  if (t.dataset.region) { state.region = t.dataset.region; route(); }
  else if (t.dataset.cat) { state.cat = t.dataset.cat; route(); }
  else if (t.dataset.gocat) { state.cat = t.dataset.gocat; }
  else if (t.dataset.jump) { jump(t.dataset.jump); return; }
  else if (t.dataset.copy) {
    const txt = document.getElementById(t.dataset.copy).textContent;
    const ok = () => { t.textContent = "已複製"; setTimeout(() => t.textContent = "複製", 1500); };
    navigator.clipboard ? navigator.clipboard.writeText(txt).then(ok).catch(() => {}) : null;
    return;
  }
  else if (t.matches("a.camp")) { state.jump = "camp"; }
  else if (t.dataset.apply) {
    const qs = new URLSearchParams({ type: t.dataset.apply, clinic: t.dataset.clinic });
    if (t.dataset.item) qs.set("item", t.dataset.item);
    if (t.dataset.tier) qs.set("tier", t.dataset.tier);
    location.href = "/apply/?" + qs;
    return;
  }
  const href = t.getAttribute("href");
  if (t.tagName === "A" && href && href.startsWith("#")) { e.preventDefault(); go(href.slice(1)); }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q" || id === "cq") {
    state[id] = e.target.value;
    const pos = e.target.selectionStart;
    route();
    const q = $("#" + id); q.focus(); q.setSelectionRange(pos, pos);
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "hsearch") return;
  e.preventDefault();
  state.f = { area:"", concern:"", treat:"", lang:"", trait:"", camp:false, sort:state.f.sort };
  state.cq = $("#hq").value; go("clinics");
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.fsel; if (!k) return;
  state.f[k] = e.target.value; route();
});
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h !== cur) { cur = h; route(); scrollTo(0, 0); }
});

try { const pend = sessionStorage.getItem("sb-rev"); if (pend) { sessionStorage.removeItem("sb-rev"); cur = pend; state.jump = "review"; } } catch (_) {}
route();
loadData().then(ok => { if (ok) route(); });
</script>
</body>
</html>
